# <install dir>/docker-compose.yml  (DESIGN.md §5.3 and §10; steps: docs/INSTALL.md)
# db:    PostgreSQL 18.6, no host port, internal network only, WAL archive + backups under this folder.
# app:   the console on 127.0.0.1:8099 -> Tailscale Serve on a tailnet-only HTTPS port.
# tools: one-off commands (bootstrap, migrate, import, adopt-files): docker compose run --rm tools <command>
# Feeds run inside app: docker compose exec -T app python -m medialib joplin --tar - --apply (ops/joplin-sync.sh)
name: media-library

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  labels:
    com.centurylinklabs.watchtower.enable: "false"   # pinned versions; upgrade by hand (README)

services:
  db:
    <<: *hardening
    image: postgres:18.6-bookworm
    container_name: medialib-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres.pw
      PGDATA: /var/lib/postgresql/18/data
      POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8 --data-checksums --wal-segsize=1"
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=30
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p %f /archive
      - -c
      - archive_timeout=3600
      - -c
      - summarize_wal=on
      - -c
      - wal_compression=zstd
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - timezone=UTC
    secrets:
      - source: postgres_pw
        target: postgres.pw
    volumes:
      - ./pgdata:/var/lib/postgresql
      - ./wal-archive:/archive
      - ./backups:/backups
      - ./app/ops/archive-wal.sh:/usr/local/bin/archive-wal.sh:ro
      - ./app/deploy/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks: [db]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 512m
    shm_size: 128m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres -h 127.0.0.1 || pg_isready -U postgres -d postgres"]
      interval: 30s
      timeout: 5s
      retries: 5

  app:
    <<: *hardening
    build:
      context: ./app
      dockerfile: deploy/Dockerfile
    image: media-library:local
    container_name: medialib-app
    user: "${ML_UID}:${ML_GID}"          # the install user: must be able to read CONSOLE_PASSWORD_FILE
    read_only: true
    tmpfs: [/tmp]
    environment:
      MEDIALIB_DB_HOST: db
      MEDIALIB_DB_NAME: medialib
      MEDIALIB_SECRETS_DIR: /run/secrets
      MEDIALIB_MEDIA_DIR: /media
      MEDIALIB_STATE_DIR: /state
      MEDIALIB_BACKUP_DIR: /backups
      MEDIALIB_ORIGIN: ${MEDIALIB_ORIGIN}
      OWNER_LOGIN: ${OWNER_LOGIN}
      MEDIALIB_PASSWORD_FILE: /console-password
      MEDIALIB_PASSKEYS_FILE: /agent-console-state/passkeys.json
      MEDIALIB_COOKIE_SECURE: "1"
      MEDIALIB_READER_USER: ${READER_USER:-reader}       # reading apps (Readest): OPDS + KOReader sync login
      MEDIALIB_READER_PASSWORD_FILE: /run/secrets/reader.pw
      MEDIALIB_FIND_URL: ${BOOK_FIND_URL:-}              # optional "find this book" link for books without a file ({q} = title + author)
      MEDIALIB_FIND_LABEL: ${BOOK_FIND_LABEL:-}
    secrets:
      - source: ml_app_pw
        target: ml_app.pw
      - source: ml_readonly_pw
        target: ml_readonly.pw
      - source: reader_pw
        target: reader.pw
      - source: google_books_key
        target: google-books.key
    volumes:
      - ./media:/media
      - ./state:/state
      - ./backups:/backups:ro
      - ${CONSOLE_PASSWORD_FILE}:/console-password:ro
      - ${AGENT_CONSOLE_STATE}:/agent-console-state:ro
    ports:
      - "127.0.0.1:8099:8099"
    networks: [db, egress]               # egress: Apple Books / Open Library lookups, cover downloads
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 100
    depends_on:
      db:
        condition: service_healthy

  tools:
    image: media-library:local
    profiles: [tools]
    user: "${ML_UID}:${ML_GID}"
    entrypoint: ["python", "-m", "medialib"]
    environment:
      MEDIALIB_DB_HOST: db
      MEDIALIB_DB_NAME: medialib
      MEDIALIB_SECRETS_DIR: /run/secrets
      MEDIALIB_MEDIA_DIR: /media
    secrets:
      - source: postgres_pw
        target: postgres.pw
      - source: ml_migrator_pw
        target: ml_migrator.pw
      - source: ml_app_pw
        target: ml_app.pw
      - source: ml_readonly_pw
        target: ml_readonly.pw
      - source: google_books_key
        target: google-books.key
    volumes:
      - ./media:/media
      - ./out:/out
      - ${SNAPSHOT_DIR}:/snapshot:ro
    working_dir: /out
    networks: [db, egress]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy

networks:
  db:
    internal: true                       # the database has no route out and no host port
  egress: {}

secrets:
  postgres_pw:
    file: ./secrets/postgres.pw
  ml_migrator_pw:
    file: ./secrets/ml_migrator.pw
  ml_app_pw:
    file: ./secrets/ml_app.pw
  ml_readonly_pw:
    file: ./secrets/ml_readonly.pw
  reader_pw:
    file: ./secrets/reader.pw
  google_books_key:                     # optional: a Google Books API key, or an empty file (Google then stays off)
    file: ./secrets/google-books.key
