name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  private-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scanner self-test
        run: scripts/scan-private.sh --self-test
      - name: No private patterns in the tree, the new commits and their authors
        env:
          # The extra private patterns are the repository secret PRIVATE_PATTERNS (one line), never in this public
          # file. Pushes to main and same-repo pull requests fail without it; pull requests from forks and Dependabot
          # get no secrets and scan with the built-in patterns only (the script prints a notice).
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          REQUIRE_PRIVATE_PATTERNS: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '1' || '0' }}
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/scan-private.sh --length
          scripts/scan-private.sh
          # The new commits: their messages, added lines and identities.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            scripts/scan-private.sh --history "$BEFORE..$AFTER"
          else
            echo "::notice::No earlier commit to compare with (new branch or force push): scanning every commit after the baseline"
            scripts/scan-private.sh --history "$AFTER"
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The production image; checksums on, as initdb does in deploy/docker-compose.yml.
        image: postgres:18.6-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_INITDB_ARGS: "--locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8 --data-checksums"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MEDIALIB_DB_HOST: 127.0.0.1
      MEDIALIB_DB_PORT: "5432"
      MEDIALIB_SECRETS_DIR: ${{ github.workspace }}/.ci-secrets
      MEDIALIB_MEDIA_DIR: ${{ github.workspace }}/.ci-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Role passwords for the test database (throwaway)
        run: |
          mkdir -p .ci-secrets .ci-media
          echo ci-only-password > .ci-secrets/postgres.pw
          for r in ml_migrator ml_app ml_readonly; do python -c 'import secrets; print(secrets.token_urlsafe(24))' > .ci-secrets/$r.pw; done
      - name: Tests (schema rules, importer, metadata fill, web API)
        run: pytest -q tests/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and import the package from another folder
        run: |
          docker build -t media-library:ci -f deploy/Dockerfile .
          docker run --rm -w /tmp --entrypoint python media-library:ci -m medialib --help
          docker compose -f deploy/docker-compose.yml config -q
        env:
          ML_UID: "1000"
          ML_GID: "1000"
          OWNER_LOGIN: ci@example.com
          MEDIALIB_ORIGIN: https://ci.example
          CONSOLE_PASSWORD_FILE: /dev/null
          AGENT_CONSOLE_STATE: /tmp
          SNAPSHOT_DIR: /tmp
