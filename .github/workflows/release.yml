name: Release

# Push a tag like v0.1.0: the tree is scanned, then a draft GitHub Release is
# created with that version's CHANGELOG section and a source archive. CI on
# main must already be green. Publish the draft by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No private patterns in the tree
        env:
          PRIVATE_PATTERNS: ${{ vars.PRIVATE_PATTERNS }}
        run: scripts/scan-private.sh
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $VERSION" >&2; exit 1; }
          git archive --format=tar.gz --prefix="media-library-$VERSION/" -o "media-library-$VERSION.tar.gz" "$TAG"
          gh release create "$TAG" "media-library-$VERSION.tar.gz" --draft --verify-tag \
            --title "media-library $VERSION" --notes-file notes.md
