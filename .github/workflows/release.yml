name: Release

# Push a tag like v0.1.0: the tree, the commits since the previous tag and the
# tag itself are scanned (read-only token), then a draft GitHub Release is
# created (the only job with a write token) with that version's CHANGELOG
# section and a source archive. CI on main must already be green. Publish the
# draft by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scanner self-test
        run: scripts/scan-private.sh --self-test
      - name: No private patterns in the tree, the commits since the last tag and the tag
        env:
          PRIVATE_PATTERNS: ${{ secrets.PRIVATE_PATTERNS }}
          REQUIRE_PRIVATE_PATTERNS: "1"
          TAG: ${{ github.ref_name }}
        run: |
          scripts/scan-private.sh --length
          scripts/scan-private.sh
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          scripts/scan-private.sh --history "${prev:+$prev..}$TAG" "$TAG"

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $VERSION" >&2; exit 1; }
          git archive --format=tar.gz --prefix="media-library-$VERSION/" -o "media-library-$VERSION.tar.gz" "$TAG"
          gh release create "$TAG" "media-library-$VERSION.tar.gz" --draft --verify-tag \
            --title "media-library $VERSION" --notes-file notes.md
