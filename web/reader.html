<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Reader · Media Library</title>
<style>
/* In-browser EPUB reader for the media-library console (served at /read?file=<uuid>).
   Tokens are copied from index.html so both pages look like one app. The book itself is rendered by
   foliate-js (vendor/foliate-js, see VENDORED.md); the app code is reader.js (no inline script, so the
   page's CSP can keep script-src 'self' and EPUB scripts can never run). */
:root {
  --bg: #f4f5f2; --panel: #ffffff; --sunk: #eceee9; --fg: #1c221f; --muted: #5f6964; --line: #d8dcd5;
  --sel: #e3ebe6; --accent: #2f6f5b; --accent-soft: #dcebe4; --on-accent: #ffffff;
  --bad: #c2412d; --bad-soft: #f6dfda; --shadow: rgb(0 0 0 / 0.14);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Noto Serif", "DejaVu Serif", serif;
  --tap: 40px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121614; --panel: #1a1f1c; --sunk: #222824; --fg: #e2e7e4; --muted: #98a29c; --line: #303833;
  --sel: #26322c; --accent: #7cc4a9; --accent-soft: #23362f; --on-accent: #10201a;
  --bad: #ef7a64; --bad-soft: #3d231e; --shadow: rgb(0 0 0 / 0.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1a1f1c; --sunk: #222824; --fg: #e2e7e4; --muted: #98a29c; --line: #303833;
  --sel: #26322c; --accent: #7cc4a9; --accent-soft: #23362f; --on-accent: #10201a;
  --bad: #ef7a64; --bad-soft: #3d231e; --shadow: rgb(0 0 0 / 0.5); color-scheme: dark; }
@media (pointer: coarse) { :root { --tap: 44px; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--sans); -webkit-text-size-adjust: 100%;
  display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* buttons */
.ib { flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: var(--tap); height: var(--tap);
  padding: 0 8px; border: 0; border-radius: 8px; background: none; color: var(--fg); text-decoration: none; font-size: 14px;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
@media (hover: hover) { .ib:hover { background: var(--sel); } }
.ib:active { background: var(--sel); }
.ib:disabled { opacity: .35; cursor: default; background: none; }
.ib svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ib .aa { font-family: var(--serif); font-weight: 600; line-height: 1; }
.ib .aa.s { font-size: 14px; } .ib .aa.l { font-size: 20px; }

/* top bar */
header.bar { flex: none; position: relative; z-index: 20; display: flex; align-items: center; gap: 4px;
  padding-top: calc(4px + env(safe-area-inset-top, 0px)); padding-bottom: 4px;
  background: var(--panel); border-bottom: 1px solid var(--line); }
.back { margin-left: -8px; color: var(--accent); font-weight: 600; }
.back span { padding-right: 4px; }
.title { flex: 1 1 auto; min-width: 0; margin: 0 8px; font-size: 15px; font-weight: 650; line-height: 1.5;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title .by { color: var(--muted); font-weight: 400; }
.tools { flex: none; display: flex; align-items: center; gap: 2px; margin-right: -8px; }
.tools .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
@media (max-width: 560px) { .back span, .title .by, .tools .sep { display: none; } }

/* reading area */
main.stage { flex: 1 1 auto; position: relative; min-height: 0; background: var(--bg);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
foliate-view { display: block; width: 100%; height: 100%; }
.status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; box-shadow: 0 6px 22px var(--shadow); }
.card h2 { margin: 0 0 6px; font-size: 16px; font-weight: 650; }
.card p { margin: 0 0 12px; color: var(--muted); overflow-wrap: anywhere; }
.card.err h2 { color: var(--bad); }
.card .detail { font-family: var(--mono); font-size: 12px; background: var(--sunk); border-radius: 8px; padding: 8px 10px; color: var(--fg); }
.card a { color: var(--accent); font-weight: 600; text-decoration: none; }
.loading { color: var(--muted); display: flex; align-items: center; gap: 10px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }

/* bottom progress */
footer.foot { flex: none; position: relative; z-index: 20; background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); }
.track { position: absolute; left: 0; right: 0; top: -1px; height: 3px; background: var(--sunk); }
.fill { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
.row { display: flex; align-items: center; gap: 6px; padding-top: 3px; }
.row .prev { margin-left: -8px; } .row .next { margin-right: -8px; }
.where { flex: 1 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 12px; font-size: 12.5px; color: var(--muted); }
.chap { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loc { flex: none; font-variant-numeric: tabular-nums; }
.pct { flex: none; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--fg); }
@media (max-width: 560px) { .loc { display: none; } }

/* table of contents */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(0 0 0 / 0.28); }
.toc { position: fixed; z-index: 45; top: 0; bottom: 0; left: 0; width: min(380px, calc(100vw - 40px)); display: flex; flex-direction: column;
  background: var(--panel); border-right: 1px solid var(--line); box-shadow: 8px 0 30px var(--shadow);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); }
.toc-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; border-bottom: 1px solid var(--line); }
.toc-head h2 { flex: 1; margin: 0; font-size: 15px; font-weight: 650; }
.toc-list { flex: 1 1 auto; overflow: auto; -webkit-overflow-scrolling: touch; padding: 6px 8px 16px; overscroll-behavior: contain; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc ol ol { padding-left: 14px; }
.toc button.it { display: block; width: 100%; min-height: var(--tap); text-align: left; border: 0; background: none; border-radius: 8px;
  padding: 8px 10px; font-size: 14.5px; line-height: 1.3; color: var(--fg); }
.toc ol ol button.it { font-size: 13.5px; color: var(--muted); }
@media (hover: hover) { .toc button.it:hover { background: var(--sel); } }
.toc button.it:active { background: var(--sel); }
.toc button.it[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc .empty { padding: 12px 10px; color: var(--muted); }
</style>
<script type="module" src="reader.js"></script>
</head>
<body>
<header class="bar gutter">
  <a class="ib back" href="./" title="Back to the library" aria-label="Back to the library">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Library</span></a>
  <h1 class="title" id="title">Opening…</h1>
  <div class="tools">
    <button class="ib" id="toc-btn" type="button" title="Contents" aria-label="Contents" aria-haspopup="dialog" aria-expanded="false" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button class="ib" id="font-dec" type="button" title="Smaller text" aria-label="Smaller text" disabled><span class="aa s" aria-hidden="true">A</span></button>
    <button class="ib" id="font-inc" type="button" title="Larger text" aria-label="Larger text" disabled><span class="aa l" aria-hidden="true">A</span></button>
  </div>
</header>

<main class="stage" id="stage">
  <div class="status" id="status" role="status" aria-live="polite">
    <div class="loading"><span class="spin" aria-hidden="true"></span><span id="status-text">Opening the book…</span></div>
  </div>
</main>

<footer class="foot gutter">
  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <div class="row">
    <button class="ib prev" id="prev" type="button" title="Previous page" aria-label="Previous page" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="where" aria-live="off">
      <span class="chap" id="chap"></span>
      <span class="loc" id="loc"></span>
      <span class="pct" id="pct" role="progressbar" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100"></span>
    </div>
    <button class="ib next" id="next" type="button" title="Next page" aria-label="Next page" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="toc" id="toc" role="dialog" aria-modal="true" aria-labelledby="toc-title" hidden>
  <div class="toc-head">
    <h2 id="toc-title">Contents</h2>
    <button class="ib" id="toc-close" type="button" title="Close" aria-label="Close contents">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <nav class="toc-list" id="toc-list" aria-label="Table of contents"></nav>
</aside>
</body>
</html>
